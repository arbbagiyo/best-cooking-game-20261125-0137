<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightning Kitchen — fast cooking game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #2b1a12;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
  }
  #wrap {
    width: min(1024px, 100vw);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: auto;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1024" height="640"></canvas>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
